name = "silent-queen-3bd2"
main = "worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "./"
binding = "ASSETS"

# ============================================================
# WHY YOUR BINDING KEPT DISAPPEARING:
# This worker builds from GitHub. wrangler.toml is the source of
# truth - anything you add in the dashboard gets wiped on the next
# deploy unless it is declared HERE.
#
# FIX (one paste):
#   1. Dashboard > Storage & Databases > KV > avalanche-tips
#   2. Copy the "Namespace ID" (32 hex characters)
#   3. Replace PASTE_ID_HERE below with it, save, commit+push.
# ============================================================

[[kv_namespaces]]
binding = "TIPS_KV"
id = "1ef530d3f7b34be6bdc7f43297786da3"

[vars]
GITHUB_REPO = "2aresship/seattleavalanche"
